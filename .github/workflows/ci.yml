name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per branch: a newer push cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repository
permissions:
  contents: read

# Actions are pinned to commit SHAs (Dependabot keeps them current); the tag is in the comment.
jobs:
  # Scans the full git history for committed secrets. Needs no repository secrets, so it is safe
  # on pull requests from forks, and runs in parallel with the other jobs.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Pinned release with checksum verification instead of a third-party action
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Scan git history
        run: ./gitleaks git . --config .gitleaks.toml --log-opts="--all" --redact -v --no-banner

  # Static checks, unit tests with coverage, and the production build. No database needed.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Formatting
        run: bun run format:check

      # Vitest with an 80% coverage threshold on lib/domain
      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

  # Database layer against a local Supabase started in the runner. Never touches staging or
  # production. Starts only the services the tests need.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: bunx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Apply migrations and seed
        run: bun run db:reset

      # The committed generated types must match what the migrations produce. Skipped while the
      # file is still the placeholder (until the first tables exist). To fix a failure: run
      # `bun run db:types:staging` after pushing migrations to staging, or take the file from the
      # artifact attached to this run.
      - name: Generated types are current
        run: |
          bunx supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          if grep -q "Placeholder until the first tables exist" lib/database.types.ts; then
            echo "::notice::lib/database.types.ts is still the placeholder, drift check skipped"
          else
            diff -u lib/database.types.ts "$RUNNER_TEMP/database.types.ts"
          fi

      - name: Upload generated types
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: database-types
          path: ${{ runner.temp }}/database.types.ts
          retention-days: 7

      # Fails if any table in schema public lacks row-level security
      - name: RLS guard
        run: bun run check:rls

      - name: Export Supabase settings
        run: bun scripts/supabase-env.ts >> "$GITHUB_ENV"

      - name: Database tests
        run: bun run test:db

      - name: Stop local Supabase
        if: always()
        run: bunx supabase stop --no-backup

  # End-to-end tests (Playwright) against the production build and a local Supabase.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: bunx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Apply migrations and seed
        run: bun run db:reset

      - name: Export Supabase settings
        run: bun scripts/supabase-env.ts >> "$GITHUB_ENV"

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: bunx supabase stop --no-backup

  # Repository rules that are easy to forget: applied migrations are immutable, and a new
  # migration should come with an ADR when it records a lasting decision.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Never edit or delete a migration that is already on the base branch. Override with the
      # label allow-migration-edit when the migration was never applied anywhere.
      - name: Applied migrations are not edited
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'allow-migration-edit') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-status "$BASE...HEAD" -- supabase/migrations | awk '$1 != "A"')
          if [ -n "$changed" ]; then
            echo "::error::Migrations already on the base branch were modified or removed:"
            echo "$changed"
            echo "Create a new migration instead, or add the label allow-migration-edit if it was never applied."
            exit 1
          fi

      - name: New migrations come with an ADR (reminder)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          added=$(git diff --name-status "$BASE...HEAD" -- supabase/migrations | awk '$1 == "A"')
          adr=$(git diff --name-only "$BASE...HEAD" -- docs/adr)
          if [ -n "$added" ] && [ -z "$adr" ]; then
            echo "::warning::This pull request adds a migration but no ADR. If it records a lasting decision, add one in docs/adr."
          fi

  # Known vulnerabilities in production dependencies (high and critical only, to avoid noise)
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun audit --prod --audit-level=high
