# Weekly dependency updates. Minor and patch updates are grouped to keep the pull request count low.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; revisit when it does
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # Keeps the pinned GitHub Actions commit SHAs current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
